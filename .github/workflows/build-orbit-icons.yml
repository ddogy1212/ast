name: Build Orbit Keepsake icons

on:
  push:
    paths:
      - 'icons/orbit-nebula.svg'
      - '.github/workflows/build-orbit-icons.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check Pillow
      - name: Render PWA PNGs from supplied photograph
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageOps, ImageFilter
          from io import BytesIO
          import re,base64

          source=Path("icons/orbit-nebula.svg").read_text()
          match=re.search(r'href="data:image/jpeg;base64,([^"]+)"',source)
          if not match:
              raise ValueError("Embedded Hubble image is missing")
          image=Image.open(BytesIO(base64.b64decode(match.group(1),validate=True))).convert("RGB")
          out=Path("icons")
          out.mkdir(exist_ok=True)
          for size in (192, 512):
              icon=ImageOps.fit(image,(size,size),Image.Resampling.LANCZOS)
              icon.save(out/f"icon-{size}.png","PNG",optimize=True)
          apple=ImageOps.fit(image,(180,180),Image.Resampling.LANCZOS)
          apple.save(out/"apple-touch-180.png","PNG",optimize=True)
          base=ImageOps.fit(image,(512,512),Image.Resampling.LANCZOS)
          maskable=base.filter(ImageFilter.GaussianBlur(14))
          foreground=base.resize((405,405),Image.Resampling.LANCZOS)
          maskable.paste(foreground,((512-405)//2,(512-405)//2))
          maskable.save(out/"maskable-512.png","PNG",optimize=True)
          for filename in ("icon-192.png","icon-512.png","apple-touch-180.png","maskable-512.png"):
              with Image.open(out/filename) as check:
                  assert check.size in ((192,192),(512,512),(180,180))
              print(filename,(out/filename).stat().st_size)
          PY
      - name: Commit generated icons
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add icons/icon-192.png icons/icon-512.png icons/apple-touch-180.png icons/maskable-512.png
          if ! git diff --cached --quiet; then
            git commit -m "Generate Android and iOS app icons from green nebula photo"
            git push origin "HEAD:main"
          fi
